rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no actions; its controls are entities.
  appropriate-polling:
    status: done
    comment: >-
      Modbus every 10 s and the web interface every 60 s by default, at least
      5 s; the grid meter power alone can be read every second on request.
  brands:
    status: done
    comment: >-
      A custom integration: icon and logo ship in brand/, which Home Assistant
      reads for custom integrations.
  common-modules: done
  config-flow:
    status: done
    comment: >-
      Every field has a data_description. The update intervals are not asked at
      setup; the entry starts with the defaults and Configure changes them.
      The data holds the connection, the options the update intervals alone.
      Configure can also change the connection, as it always could; that part
      is written to the data.
  config-flow-test-coverage: done
  dependency-transparency:
    status: done
    comment: >-
      modbus-connection is the open-source library of Home Assistant's own
      modbus integration, published on PyPI from public CI.
  docs-actions:
    status: exempt
    comment: The integration registers no actions.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup: done
  entity-unique-id:
    status: done
    comment: >-
      fm_<entry>_<key>, built on the config entry id since 0.2. Moving it to
      the serial number would cut off the history of every installation.
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry:
    status: done
    comment: >-
      The unique id is the inverter's serial number; an entry from before 1.5
      takes it at its next setup. The flow also aborts for a host another
      entry has, whatever its unique id.

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: Every module above 95 %, held by .github/scripts/check_module_coverage.py.

  # Gold
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: done
    comment: >-
      An MPPT string dark at setup gets its sensors in place once it sends a
      value. A battery, meter or other sub-system that answers for the first
      time after setup, and a meter the web API names later, reload the entry
      on their own, with no action of the owner: they need new Modbus units and
      the adoption of entities from earlier versions that only setup runs, and
      a reload is what keeps those entities' history.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: done
    comment: >-
      Never removed on doubt: a meter that stops answering keeps its history.
      The owner deletes a device the inverter no longer reports.

  # Platinum
  async-dependency:
    status: done
    comment: >-
      Modbus runs on modbus-connection, the async library of Home Assistant's
      modbus integration; the web API client is async over aiohttp.
  inject-websession:
    status: done
    comment: >-
      The web API client takes its aiohttp session from outside. The
      integration passes one session for all entries from
      async_create_clientsession, with no cookie jar: the client never kept
      the inverter's cookies, and must not hand them to anything else.
  strict-typing:
    status: done
    comment: >-
      A custom integration, so not in core's .strict-typing: every module is in
      the mypy scope with strict = true, checked in CI and by
      tests/test_mypy_scope.py. modbus-connection ships py.typed. The entry
      points take the typed FroniusConfigEntry.
